
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-assistant-api
  namespace: rag-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-assistant-api
  template:
    metadata:
      labels:
        app: knowledge-assistant-api
    spec:
      enableServiceLinks: false
      containers:
        - name: knowledge-assistant-api
          image: knowledge-assistant-api:18
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: QDRANT_HOST
              value: "qdrant"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: OPENAI_API_KEY

---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-assistant-api
  namespace: rag-app
spec:
  type: ClusterIP
  selector:
    app: knowledge-assistant-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
