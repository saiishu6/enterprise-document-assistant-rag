spring.application.name=knowledge-assistant-api

# chat model
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.chat-model.model-name=gpt-4.1-mini

# Embedding model
langchain4j.open-ai.embedding-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.embedding-model.model-name=text-embedding-3-small

# Qdrant configuration
qdrant.host=${QDRANT_HOST:localhost}
qdrant.port=6334
qdrant.rest-port=6333
qdrant.collection-name=knowledge_documents